{% extends "base.html" %}
{% block title %}Ошибка {{ code }}{% endblock %}
{% block content %}<section class="panel narrow"><h1>Ошибка {{ code }}</h1><p>{{ message }}</p><a class="button" href="{{ url_for('dashboard') if session.get('user_id') else url_for('login') }}">На главную</a></section>{% endblock %}
