{% extends "base.html" %}
{% block title %}Ошибка {{ code }} — СК Держава{% endblock %}
{% block content %}
<section class="error-card"><div class="error-code">{{ code }}</div><h1>Что-то пошло не так</h1><p>{{ message }}</p><a class="button button-primary" href="{{ url_for('dashboard') if session.get('user_id') else url_for('login') }}">Вернуться в систему</a></section>
{% endblock %}
