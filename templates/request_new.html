{% extends "base.html" %}
{% block title %}Новая заявка — СК Держава{% endblock %}
{% block content %}
<div class="narrow"><a href="{{ url_for('dashboard') }}">← Назад</a><h1>Новая заявка на ремонт</h1>
{% if not equipment %}<p class="alert error">Для вашей организации пока нет зарегистрированного оборудования. Обратитесь к администратору.</p>{% else %}
<form method="post" class="form-stack panel">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Оборудование<select name="equipment_id" required><option value="">Выберите оборудование</option>{% for e in equipment %}<option value="{{ e.equipment_id }}">{{ e.equipment_name }}{% if e.serial_number %} · {{ e.serial_number }}{% endif %}</option>{% endfor %}</select></label>
<label>Приоритет<select name="priority"><option value="low">Низкий</option><option value="medium" selected>Средний</option><option value="high">Высокий</option><option value="urgent">Срочный</option></select></label>
<label>Описание неисправности<textarea name="problem_description" rows="6" minlength="10" required placeholder="Опишите проблему и обстоятельства её возникновения..."></textarea></label>
<button class="button" type="submit">Отправить заявку</button>
</form>{% endif %}</div>
{% endblock %}
